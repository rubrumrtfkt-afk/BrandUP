<!doctype html>
<html lang="en-AU" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08070B" />
    <meta name="color-scheme" content="dark" />
    <!-- v4.4 (owner: "the screen flashes"): the first paint happened BEFORE the stylesheet (in dev Vite injects the CSS
         from JS), in the browser's default white: WebKit showed ~200 ms of white (Y 236) at every first visit. The ground
         is painted from the HTML itself now. -->
    <style>html,body{background:#08070B;color:#F4F1F8;color-scheme:dark}</style>
    <title>BrandUp | AI agents for industrial and B2B companies in Australia</title>
    <meta name="description" content="BrandUp builds and runs an office of AI agents for Australian industrial and B2B companies. They work overnight; you approve the big calls." />
    <link rel="canonical" href="https://brandupadvisory.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrandUp" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:url" content="https://brandupadvisory.com/" />
    <meta property="og:title" content="BrandUp | AI agents for industrial and B2B companies" />
    <meta property="og:description" content="An office of AI agents that works overnight. You approve the big calls." />
    <meta property="og:image" content="https://brandupadvisory.com/og-brandup.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A triangle of purple light points: six agents, three brains and one vertex, where you approve." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrandUp | AI agents for industrial and B2B companies" />
    <meta name="twitter:description" content="An office of AI agents that works overnight. You approve the big calls." />
    <meta name="twitter:image" content="https://brandupadvisory.com/og-brandup.jpg" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"BrandUp","url":"https://brandupadvisory.com/","logo":"https://brandupadvisory.com/apple-touch-icon.png","areaServed":"AU","description":"AI agents for Australian industrial and B2B companies, built and run by BrandUp."}</script>
    <!-- juri-v4 D5: the display face is declared HERE (not preloaded): the parser finds it with the H1 and
         WebKit fetches it once. It paints the H1, which is the LCP. -->
    <style>@font-face{font-family:"BU Display";src:url(/fonts/bu-display.woff2) format("woff2");font-weight:300 400;font-stretch:87.5%;font-display:swap}</style>
    <script>
      // no-js → js; the button look (field: the owner's pick, 09/11; the variants are gone); the intro (brief-v4.1 §4.9): first visit of the
      // session, no reduced motion, no Save-Data, no ?gl=0.
      (function () {
        var d = document.documentElement, q = new URLSearchParams(location.search);
        d.classList.remove('no-js');
        d.classList.add('btn-field');
        var c = navigator.connection, seen = false;
        try { seen = sessionStorage.getItem('bu-intro') === '1'; sessionStorage.setItem('bu-intro', '1'); } catch (e) { seen = false; }
        if (q.has('intro')) seen = false;
        if (!seen && q.get('gl') !== '0' && !(c && c.saveData) && !matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('intro');
      })();
    </script>
    <style>
      /* intro (brief-v4.2 §4): 13 points light on the base (9 at 390) with a dotted green energy aura, run to the
         foot of the shaft leaving the purple body behind them (the green front climbs with it), become a white beam
         that opens the arrow and leaves through the apex taking the green with it. The logo stays purple + white:
         the green is never inside the arrow (the front and the auras are clipped out of its silhouette). */
      #intro,.intro-logo,.intro-skipbtn{display:none}
      .intro #intro{display:block;position:fixed;z-index:1;left:calc(var(--ix) - var(--iw)/2);top:var(--iy);width:var(--iw);height:var(--ih);pointer-events:none;transform-origin:50% 0;animation:i-open .36s cubic-bezier(.65,0,.35,1) .82s forwards,i-fade .36s steps(4,end) .82s forwards}
      #intro svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
      #intro .i-body{clip-path:inset(100% 0 0 0);animation:i-clip .32s cubic-bezier(.45,0,.2,1) .2s forwards}
      #intro .i-front{opacity:0;animation:i-on .01s steps(1,end) .2s forwards,i-climb .32s cubic-bezier(.45,0,.2,1) .2s forwards,i-fade .04s steps(1,end) .52s forwards}
      #intro .i-arrow{clip-path:inset(91% 0 9% 0);animation:i-arr .18s linear .52s forwards}
      #intro .i-beam{opacity:0;animation:i-on .01s steps(1,end) .52s forwards,i-beam .18s linear .52s forwards,i-fade .02s steps(1,end) .7s forwards}
      #intro .i-dot{position:absolute;left:calc(var(--x)*100%);top:97.9%;width:4px;height:4px;margin:-2px;opacity:0;animation:i-on .04s steps(1,end) calc(80ms + var(--d)) forwards,i-go .32s cubic-bezier(.45,0,.2,1) .2s forwards,i-fade .04s steps(1,end) .52s forwards}
      #intro .i-dot::before{content:"";position:absolute;left:-8px;top:-8px;width:20px;height:20px;background:repeating-conic-gradient(#58F6B1 0 25%,transparent 0 50%) 0 0/4px 4px;-webkit-mask:radial-gradient(circle closest-side,rgba(0,0,0,.4) 0 55%,rgba(0,0,0,.15) 55% 100%,transparent 100%);mask:radial-gradient(circle closest-side,rgba(0,0,0,.4) 0 55%,rgba(0,0,0,.15) 55% 100%,transparent 100%);animation:i-flick .36s steps(3,end) infinite,i-fade .04s steps(1,end) .46s forwards} /* taste-skill-ignore: a 4-px checker (the dotted energy aura) cut by a hard-stop disc mask, not a gradient fill */
      #intro .i-dot::after{content:"";position:absolute;inset:0;background:#FBF7FF}
      #intro .i-colw{position:absolute;left:50%;bottom:100%;width:10px;margin-left:-5px;height:calc(var(--iy) + 8px);overflow:hidden}
      #intro .i-col{position:absolute;left:0;top:0;width:6px;height:100%;background:#FFFFFF;border-inline:2px solid rgba(88,246,177,.45);transform:translateY(100%);animation:i-col .12s cubic-bezier(.4,0,.8,.6) .7s forwards,i-fade .12s steps(3,end) .7s forwards}
      .intro .intro-logo{display:block;position:fixed;z-index:4;left:0;top:0;width:30px;height:30px;opacity:0;transform:translate(calc(var(--ix) - 15px),calc(var(--iy) - 15px));animation:i-logo .36s cubic-bezier(.65,0,.35,1) .82s forwards}
      .intro .bar .brand{opacity:0;animation:i-on .12s linear 1.1s forwards}
      .intro .intro-skipbtn{display:block;position:fixed;z-index:5;left:-999px;top:12px}
      .intro .intro-skipbtn:focus{left:12px}
      .intro-skip #intro,.intro-skip .intro-logo{animation:none;opacity:0;transition:opacity .15s}
      .intro-skip .bar .brand{animation:none;opacity:1}
      :root{--ix:79vw;--iy:13vh;--ih:78vh;--iw:83.57vh;--ty:10vh;--ts:.82}
      @media (max-width:767px){:root{--ix:50vw;--iy:380px;--ih:420px;--iw:330px;--ty:191px;--ts:.55}.intro .intro-logo{display:none}.intro .bar .brand{animation:i-on .2s linear .82s forwards}#intro .i-dot:nth-of-type(3n+2):not(:first-of-type){display:none}#intro .i-colw{height:64px}}
      @keyframes i-on{to{opacity:1}}
      @keyframes i-clip{to{clip-path:inset(0)}}
      @keyframes i-arr{to{clip-path:inset(27% 0 9% 0)}}
      @keyframes i-climb{to{transform:translateY(-27.6px)}}
      @keyframes i-beam{to{transform:translateY(-17px)}}
      @keyframes i-go{to{transform:translate(calc((.5 - var(--x)) * var(--iw)),calc(-1.2 / 28 * var(--ih)))}}
      @keyframes i-col{to{transform:translateY(-110%)}}
      @keyframes i-flick{0%{opacity:1}33%{opacity:.5}66%{opacity:.8}}
      @keyframes i-open{to{transform:translateY(var(--ty)) scale(var(--ts))}}
      @keyframes i-fade{to{opacity:0}}
      @keyframes i-logo{0%,90%{opacity:1}to{opacity:1;transform:translate(var(--m,64px),21px)}}
    </style>
  </head>
  <body>
    <button type="button" class="intro-skipbtn" id="intro-skip">Skip intro</button>
    <div id="intro" aria-hidden="true">
      <svg class="i-body" viewBox="0 0 30 28" preserveAspectRatio="none"><defs><pattern id="ib" width=".24" height=".24" patternUnits="userSpaceOnUse"><rect width=".24" height=".24" fill="#7A22CF"/><rect width=".12" height=".12" fill="#9232EA"/><rect x=".12" y=".12" width=".12" height=".12" fill="#9232EA"/></pattern><pattern id="iw" width=".24" height=".24" patternUnits="userSpaceOnUse"><rect width=".24" height=".24" fill="#FBF7FF"/><rect width=".12" height=".12" fill="#FFFFFF"/><rect x=".12" y=".12" width=".12" height=".12" fill="#FFFFFF"/></pattern><pattern id="ig" width=".24" height=".24" patternUnits="userSpaceOnUse"><rect width=".12" height=".12" fill="#58F6B1" fill-opacity=".55"/><rect x=".12" y=".12" width=".12" height=".12" fill="#58F6B1" fill-opacity=".3"/></pattern><clipPath id="ifc"><path clip-rule="evenodd" d="M15 0L30 28L0 28ZM15 7.4L21.9 17.6L9.1 17.6ZM12 15.5H18V25.6H12Z"/></clipPath></defs><path d="M15 0L30 28L0 28Z" fill="url(#ib)"/></svg>
      <svg viewBox="0 0 30 28" preserveAspectRatio="none"><g clip-path="url(#ifc)"><rect class="i-front" y="27.6" width="30" height=".4" fill="url(#ig)"/></g></svg>
      <svg class="i-arrow" viewBox="0 0 30 28" preserveAspectRatio="none"><g fill="url(#iw)"><path d="M15 8L21 17L9 17Z"/><rect x="12.5" y="16" width="5" height="9" rx="2.5"/></g><rect class="i-beam" x="14.2" y="24.4" width="1.6" height=".9" fill="#FFFFFF"/></svg>
      <i class="i-dot" style="--x:0.05;--d:12ms"></i><i class="i-dot" style="--x:0.12;--d:47ms"></i><i class="i-dot" style="--x:0.2;--d:3ms"></i><i class="i-dot" style="--x:0.265;--d:33ms"></i><i class="i-dot" style="--x:0.345;--d:58ms"></i><i class="i-dot" style="--x:0.41;--d:21ms"></i><i class="i-dot" style="--x:0.5;--d:8ms"></i><i class="i-dot" style="--x:0.565;--d:40ms"></i><i class="i-dot" style="--x:0.64;--d:26ms"></i><i class="i-dot" style="--x:0.715;--d:52ms"></i><i class="i-dot" style="--x:0.79;--d:15ms"></i><i class="i-dot" style="--x:0.87;--d:36ms"></i><i class="i-dot" style="--x:0.95;--d:5ms"></i>
      <div class="i-colw"><div class="i-col"></div></div>
    </div>
    <svg class="intro-logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5L35 33L5 33Z" fill="#9232EA" stroke="#9232EA" stroke-width="2" stroke-linejoin="round"/><path d="M20 13L26 22L14 22Z" fill="#fff"/><rect x="17.5" y="21" width="5" height="9" rx="2.5" fill="#fff"/></svg>
    <script>
      (function () {
        var d = document.documentElement;
        function end() { d.classList.remove('intro', 'intro-skip'); ['intro', 'intro-skip'].forEach(function (i) { var e = document.getElementById(i); if (e) e.remove(); }); var l = document.querySelector('.intro-logo'); if (l) l.remove(); }
        if (!d.classList.contains('intro')) { end(); return; }
        function skip() { d.classList.add('intro-skip'); setTimeout(end, 160); off(); }
        var ev = ['pointerdown', 'keydown', 'wheel', 'touchstart'];
        function off() { ev.forEach(function (n) { removeEventListener(n, skip, true); }); }
        ev.forEach(function (n) { addEventListener(n, skip, { capture: true, passive: true }); });
        document.getElementById('intro-skip').addEventListener('click', skip);
        // leaves the DOM when the hand-off ends (animationend of i-open, ≈ 1.18 s); the timer only covers a lost event
        var box = document.getElementById('intro');
        if (box) box.addEventListener('animationend', function (e) { if (e.animationName === 'i-open') { off(); end(); } });
        setTimeout(function () { off(); end(); }, 1600);
      })();
    </script>
    <!-- The one WebGL2 canvas of the page. Fixed behind the content, never interactive, never read by AT. -->
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="root"><!--ssr--></div>
    <script type="module" src="/src/proto/main.tsx"></script>
  </body>
</html>
