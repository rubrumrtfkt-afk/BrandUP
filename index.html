      // else loads, keeping the search and the hash (the token rides there). Otherwise the Meta Pixel, only on
      // the live site (never on local tests, never on /admin/: app.html carries its own guarded copy).
      (function () {
        var l = location, q = new URLSearchParams(l.search);
        var auth = /[?&#]type=(invite|recovery)(?:&|$)/i.test(l.href) && (q.has('token_hash') || l.hash.indexOf('access_token=') !== -1);
        if (q.get('admin') === '1' || l.hash.toLowerCase().indexOf('#/admin') === 0 || auth) { window.__buLeaving = true; l.replace('/admin/' + l.search + l.hash); return; }
        if (l.hostname !== 'brandupadvisory.com') return;
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,

    <!-- juri-v4 D5: the display face is declared HERE (not preloaded): the parser finds it with the H1 and
         WebKit fetches it once. It paints the H1, which is the LCP. -->
    <style>@font-face{font-family:"BU Display";src:url(/fonts/bu-display.woff2) format("woff2");font-weight:300 400;font-stretch:87.5%;font-display:swap}</style>
    <script>
      // no-js → js; the button look (field: the owner's pick, 09/11). v52 (owner: "won't the page have an intro any more?"):
      // the intro at EVERY load: the full one (v55b: ≈ 4.4 s, one step at a time) on the 1st visit of the session, the short one (× .6) after;
      // none with reduced motion or Save-Data (no JS = no intro). ?intro forces the full one, ?intro=short the short one.
      (function () {
        var d = document.documentElement, q = new URLSearchParams(location.search);
        d.classList.remove('no-js');
        d.classList.add('btn-field');
        var c = navigator.connection, seen = false;
        try { seen = sessionStorage.getItem('bu-intro') === '1'; sessionStorage.setItem('bu-intro', '1'); } catch (e) { seen = false; }
        if (q.has('intro')) seen = q.get('intro') === 'short';
        // v57 (owner: conversion): the page never restores a scroll; a reload starts at the top (the in-page links no
        // longer write a hash, nav.ts). A link from OUTSIDE with a hash (an ad, an e-mail: /proto.html#diagnostic) opens
        // on its target with no intro; nav.ts lands there with the header shown and drops the hash from the URL.
        try { history.scrollRestoration = 'manual'; } catch (e) { /* old engines: the browser restores, the intro skips past .3 vh */ }
        if (location.hash.length > 1 && location.hash !== '#top') { d.classList.add('from-hash'); return; }
        if ((c && c.saveData) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        d.classList.add('intro');
        if (seen) d.classList.add('intro-short');
        // v55 the intro's geometry, in px, before the first paint. v55b (owner: "um passo de cada vez", the logo almost the
        // size of the network's triangle): the logo box L = 1.77 unit, so its triangle (.7 L tall) is ~80 % of the
        // network's (1.55 unit); it is born at L/4 at the centre of the screen (from depth) and lands with its triangle
        // centred on the network's (the triangle's middle is 1/40 L over the box's centre). Same formula as layout.ts netFrame (keep them together):
        // desktop unit = min(.42 vh, .25 vw, max(150, (vw − 620)/2)), cx = vw − m − 1.12 unit, base .9 vh; phone unit = min(.25 vh, (vw/2 − 40)/1.04),
        // cx = vw/2, base .95 vh; the network's arrow is centred .47 unit over the base; the logo's arrow sits 1.5/40 of the
        // logo under the logo's centre. window.__bu tells the engine where the morph is (engine.ts, POINT_VS uLogo).
        var W = innerWidth, H = innerHeight, P = W < 768, u, cx, by, L, st = d.style;
        if (P) { u = Math.min(H * 0.25, (W / 2 - 40) / 1.04); cx = W / 2; by = H * 0.95; L = u * 1.77 }
        else { u = Math.min(H * 0.42, W * 0.25, Math.max(150, (W - 620) * 0.5)); cx = W - Math.min(64, Math.max(20, W * 0.0445)) - 1.12 * u; by = H * 0.9; L = u * 1.77 }
        st.setProperty('--ls', L.toFixed(1) + 'px'); st.setProperty('--l0', '.25');
        st.setProperty('--lx0', (W / 2).toFixed(1) + 'px'); st.setProperty('--ly0', (H / 2).toFixed(1) + 'px');
        st.setProperty('--lx1', cx.toFixed(1) + 'px'); st.setProperty('--ly1', (by - 0.775 * u + L / 40).toFixed(1) + 'px');
        window.__bu = { m: null, d: 720 * (seen ? 0.6 : 1) };
      })();
    </script>
    <!-- brief-v4.5 §4.5: before the stylesheet (dev injects it from JS) an SVG of the brand without a size paints at the
         width of the screen: sized here, and in its markup -->
    <style>.brand svg,.logo{width:28px;height:28px}@media (max-width:767px){.brand svg,.logo{width:24px;height:24px}}</style>
    <style>
      /* v55b the intro, ONE STEP AT A TIME (owner 10/11: "se fizer tudo de uma vez, as pessoas não vão acompanhar"). All
         times × --k (1, or .6 on a reload). Each step starts as the previous one ends (≤ .08 s of overlap to flow):
         1. .10–.85 s  the logo comes from depth at the centre: L/4 → L (×4), and holds still until 1.55 s (read the mark)
         2. 1.55–2.15  it travels to the network's place (on a phone, down under the text)
         3. M = the morph's start (the landing, or when the engine has drawn, ≤ 700 ms later): the SVG dissolves in 4
            steps while the engine sends its grains to the nodes and wires and the arrow settles (.72 s, engine.ts uLogo)
         4. M+.50–1.28  the hero's text lights (H1 lines, lede, button). Until then H1 and lede sit at opacity .01: painted
            from the 1st frame (the LCP) but invisible to the eye (jury v55: at .1 "$250K per month" was legible)
         5. M+1.20–1.50 the header's triangle wipes in from the bottom
         6. M+1.45–1.90 "BrandUp" slides out of the triangle, left to right, behind a fixed mask edge (and Diagnosis)
         7. M+1.85–2.20 the white arrow rises inside the triangle. The intro ends at M+2.25 (≈ 4.4 s; ≈ 2.65 s reloaded)
         Steps 4–7 hang on .intro-morph, so they never run before the network, however late the engine is. */
      /* v55b-2 (jury: the logo was born top-left and slid to the centre): the position is the `translate` PROPERTY, not
         transform: translate(); the individual properties compose translate → scale → transform, so a `scale` under a
         transform translate scaled the offset too. Now it is born exactly at the centre and grows ×4 in place. Visible from its first frame (steps jump-start: 1/4…1; jump-none held 0 while the
         scale already ran) and slow at first, like coming close. */
      :root{--k:1}.intro-short{--k:.6}
      .intro-logo{display:none}
      .intro .intro-logo{display:block;position:fixed;z-index:4;left:0;top:0;width:var(--ls);height:var(--ls);margin:calc(var(--ls)/-2) 0 0 calc(var(--ls)/-2);pointer-events:none;opacity:0;scale:var(--l0);translate:var(--lx0) var(--ly0);animation:i-on calc(.24s*var(--k)) steps(4,jump-start) calc(.1s*var(--k)) forwards,i-near calc(.8s*var(--k)) cubic-bezier(.45,.05,.25,1) calc(.1s*var(--k)) forwards,i-go calc(.6s*var(--k)) cubic-bezier(.65,0,.35,1) calc(1.55s*var(--k)) forwards}
      .intro-morph .intro-logo{scale:1;opacity:1;translate:var(--lx1) var(--ly1);animation:i-fade calc(.2s*var(--k)) steps(4,jump-none) .03s forwards}
      .intro .hero h1>:is(.h-frame,.h-giant),.intro .hero .lede{opacity:.01}
      .intro .hero .lede{transform:translate3d(0,12px,0)}
      .intro .hero .btn{opacity:0}
      .intro:not(.intro-morph) .poster-hero{visibility:hidden} /* no engine: the poster waits for step 3 */
      .intro .brand svg{clip-path:inset(100% 0 0 0);transform:translateY(8px)}
      .intro .brand>span{clip-path:inset(0 0 0 100%);transform:translateX(-100%)}
      .intro .bar-link{opacity:0}
      .intro .brand .logo-arw{transform:translateY(22px)}
      .intro-morph .hero h1>:is(.h-frame,.h-giant){animation:i-on calc(.5s*var(--k)) cubic-bezier(.2,.8,.2,1) calc(.5s*var(--k)) forwards}
      .intro-morph .hero h1>.h-giant{animation-delay:calc(.6s*var(--k))}
      .intro-morph .hero h1>.h-frame:last-child{animation-delay:calc(.7s*var(--k))}
      .intro-morph .hero .lede{animation:i-in calc(.48s*var(--k)) cubic-bezier(.2,.7,.2,1) calc(.8s*var(--k)) forwards}
      .intro-morph .hero .btn{animation:i-on calc(.24s*var(--k)) ease-out calc(1s*var(--k)) forwards}
      .intro-morph .brand svg{animation:i-wipe calc(.3s*var(--k)) cubic-bezier(.2,.8,.2,1) calc(1.2s*var(--k)) forwards}
      .intro-morph .brand>span{animation:i-out calc(.45s*var(--k)) cubic-bezier(.2,.8,.2,1) calc(1.45s*var(--k)) forwards}
      .intro-morph .bar-link{animation:i-on calc(.45s*var(--k)) ease-out calc(1.45s*var(--k)) forwards}
      .intro-morph .brand .logo-arw{animation:i-in calc(.35s*var(--k)) cubic-bezier(.2,.8,.2,1) calc(1.85s*var(--k)) forwards}
      .intro-skip .intro-logo{animation:none;opacity:0;transition:opacity .15s}
      /* v55b the engine is late (> 700 ms after the landing): the logo dissolves to a ghost of itself on the spot and the
         intro goes on; when the engine has drawn it runs the morph from that ghost (.intro-ghost-out) and removes it */
      .intro-late .intro-logo{display:block;position:fixed;z-index:4;left:0;top:0;width:var(--ls);height:var(--ls);margin:calc(var(--ls)/-2) 0 0 calc(var(--ls)/-2);pointer-events:none;scale:1;translate:var(--lx1) var(--ly1);opacity:.16;animation:i-ghost calc(.2s*var(--k)) steps(4,jump-none) forwards}
      .intro-ghost-out .intro-logo{animation:i-fade .2s steps(4,jump-none) forwards}
      .gl-off.intro-late .intro-logo{display:none}
      .intro-skip :is(.brand svg,.brand>span,.bar-link,.brand .logo-arw,.hero h1>:is(.h-frame,.h-giant),.hero .lede,.hero .btn){animation:none;opacity:1;transform:none;clip-path:none}
      .intro-skipbtn{position:fixed;z-index:5;left:-999px;top:12px}
      .intro-skipbtn:focus{left:12px}
      html:not(.intro) .intro-skipbtn{display:none}
      @media (max-width:767px){.intro .hero .lede{transform:translate3d(0,8px,0)}}
      @keyframes i-on{to{opacity:1}}
      @keyframes i-near{to{scale:1}}
      @keyframes i-go{to{translate:var(--lx1) var(--ly1)}}
      @keyframes i-wipe{to{clip-path:inset(0);transform:none}}
      @keyframes i-out{to{clip-path:inset(0);transform:none}}
      @keyframes i-in{to{opacity:1;transform:none}}
      @keyframes i-fade{to{opacity:0}}
      @keyframes i-ghost{from{opacity:1}to{opacity:.16}}
    </style>

  <body>
    <button type="button" class="intro-skipbtn" id="intro-skip">Skip intro</button>
    <svg class="intro-logo" viewBox="0 0 40 40" width="88" height="88" aria-hidden="true"><path d="M20 5L35 33L5 33Z" fill="#9232EA" stroke="#9232EA" stroke-width="2" stroke-linejoin="round"/><path d="M20 13L26 22L14 22Z" fill="#fff"/><rect x="17.5" y="21" width="5" height="9" rx="2.5" fill="#fff"/></svg>
    <script>
      // v55 the intro's clock. The logo lands (i-go ends); the morph starts there as soon as the engine has drawn (gl-on):
      // .intro-morph + .intro-handoff in one task (main.tsx shows the canvas in the next frame, while the SVG still holds
      // its first dither step) and __bu.m tells the engine the start. v55b (jury: with no GPU the logo stood 1.7–5 s): the
      // logo waits ≤ 700 ms after it lands, then dissolves where it is and the intro ends on time; __bu stays (late, with
      // the logo's box) and the engine, when it has drawn, runs the same morph from that box and then drops __bu (no
      // engine at all: the poster). Any tap,
      // key, wheel or touch (or a scroll restored past .3 of the screen, brief-v4.5 §4.6) skips to the final state.
      (function () {
        var d = document.documentElement, bu = window.__bu;
        function rm() { var e = document.getElementById('intro-skip'); if (e) e.remove(); var l = document.querySelector('.intro-logo'); if (l) l.remove(); }
        if (!d.classList.contains('intro') || !bu) { rm(); return; }
        var k = d.classList.contains('intro-short') ? 0.6 : 1, done = false, morphing = false, arrived = false, wait = 0;
        var ev = ['pointerdown', 'keydown', 'wheel', 'touchstart'];
        var logo = document.querySelector('.intro-logo');
        var mo = new MutationObserver(go);
        function off() { ev.forEach(function (n) { removeEventListener(n, skip, true); }); removeEventListener('scroll', onScroll, true); mo.disconnect(); clearTimeout(wait); }
        function end() { if (done) return; done = true; off(); d.classList.add('intro-handoff'); d.classList.remove('intro', 'intro-short', 'intro-skip', 'intro-morph'); if (!bu.late) window.__bu = undefined; try { performance.mark('hero-in'); } catch (e) {} if (bu.late) { var sb = document.getElementById('intro-skip'); if (sb) sb.remove(); } else rm(); }
        function start(engine) {
          morphing = true; clearTimeout(wait);
          if (engine) bu.m = performance.now();
          else if (d.classList.contains('gl-off') || !logo) bu.m = -1e9;
          else { var r = logo.getBoundingClientRect(); bu.box = [(r.left + r.right) / 2, (r.top + r.bottom) / 2, r.width]; bu.late = true; d.classList.add('intro-late'); } d.classList.add('intro-morph', 'intro-handoff'); dispatchEvent(new Event('bu-morph')); setTimeout(end, 2250 * k); }
        function go() { if (done || morphing || !arrived) return; if (d.classList.contains('gl-on')) start(true); else if (d.classList.contains('gl-off')) start(false); }
        function arrive() { if (arrived) return; arrived = true; wait = setTimeout(function () { if (!morphing && !done) start(false); }, 700); go(); }
        function skip() { if (done) return; bu.m = -1e9; bu.late = false; d.classList.add('intro-skip', 'intro-handoff'); dispatchEvent(new Event('bu-morph')); off(); setTimeout(end, 160); }
        function onScroll() { if (scrollY > innerHeight * 0.3) skip(); }
        ev.forEach(function (n) { addEventListener(n, skip, { capture: true, passive: true }); });
        addEventListener('scroll', onScroll, { capture: true, passive: true });
        document.getElementById('intro-skip').addEventListener('click', skip);
        mo.observe(d, { attributes: true, attributeFilter: ['class'] });
        if (logo) logo.addEventListener('animationend', function (e) { if (e.animationName === 'i-go') arrive(); });
        setTimeout(arrive, 2250 * k);
      })();
    </script>
