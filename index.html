<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BrandUp, a marketing agency focused on restaurants in Australia."
    />
    <title>BrandUp | Marketing for restaurants in Australia</title>
    <script>
      // Meta Pixel, only on the live public site (never on the lead dashboard or local tests), and never on a
      // Supabase auth link (invite/recovery): its token_hash/access_token would ride to Meta with the PageView.
      var buQuery = new URLSearchParams(location.search), buHash = location.hash;
      // A bare type= is not an auth link (it can be a campaign parameter); the token or error is.
      var buAuth = buQuery.has('token_hash') || buQuery.has('access_token') || buQuery.has('error_code') || /(^|[#&])(access_token|refresh_token|token_hash|error_code)=/.test(buHash);
      if (buAuth) {
        // Belt and braces: nothing loaded or navigated from an auth URL carries it as referrer.
        var buMeta = document.createElement('meta'); buMeta.name = 'referrer'; buMeta.content = 'no-referrer'; document.head.appendChild(buMeta);
      }
      if (location.hostname === 'brandupadvisory.com' && buQuery.get('admin') !== '1' && !buHash.toLowerCase().startsWith('#/admin') && !buAuth) {
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1748885616199469');
        fbq('track', 'PageView');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
